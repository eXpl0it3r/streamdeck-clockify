<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover">
        <meta name=apple-mobile-web-app-capable content=yes>
        <meta name=apple-mobile-web-app-status-bar-style content=black>
        <title>Clockify Settings</title>
        <link rel="stylesheet" href="sdpi.css">
        <style>
            .cf-row select, .cf-row input.cf-text { flex: 1 1 auto; }
            .cf-toggle { width: 28px; min-width: 28px; margin-left: 4px; cursor: pointer; }
            .cf-hidden { display: none !important; }
        </style>
        <script src="sdtools.common.js"></script>
    </head>
    <body>
        <div class="sdpi-wrapper">
            <div class="sdpi-item">
                <div class="sdpi-item-label">API Key</div>
                <input class="sdpi-item-value sdProperty" id="apiKey" value="" pattern="[A-Za-z0-9]+" placeholder="Enter your Private API Key" oninput="setSettings()" required>
            </div>

            <div class="sdpi-item">
                <button class="sdpi-item-value" id="cfRefresh">Listen aus Clockify aktualisieren</button>
            </div>

            <div class="sdpi-item cf-row">
                <div class="sdpi-item-label">Workspace</div>
                <select class="sdpi-item-value" id="workspaceSelect"></select>
                <input class="sdpi-item-value cf-text cf-hidden" id="workspaceText" type="text" placeholder="Workspace-Name">
                <button class="cf-toggle" id="workspaceToggle" title="Liste/Freitext umschalten">&#9998;</button>
            </div>

            <div class="sdpi-item cf-row">
                <div class="sdpi-item-label">Client</div>
                <select class="sdpi-item-value" id="clientSelect"></select>
                <input class="sdpi-item-value cf-text cf-hidden" id="clientText" type="text" placeholder="Client-Name (optional)">
                <button class="cf-toggle" id="clientToggle" title="Liste/Freitext umschalten">&#9998;</button>
            </div>

            <div class="sdpi-item cf-row">
                <div class="sdpi-item-label">Projekt</div>
                <select class="sdpi-item-value" id="projectSelect"></select>
                <input class="sdpi-item-value cf-text cf-hidden" id="projectText" type="text" placeholder="Projekt-Name">
                <button class="cf-toggle" id="projectToggle" title="Liste/Freitext umschalten">&#9998;</button>
            </div>

            <div class="sdpi-item cf-row">
                <div class="sdpi-item-label">Task</div>
                <select class="sdpi-item-value" id="taskSelect"></select>
                <input class="sdpi-item-value cf-text cf-hidden" id="taskText" type="text" placeholder="Task-Name (neu wird angelegt)">
                <button class="cf-toggle" id="taskToggle" title="Liste/Freitext umschalten">&#9998;</button>
            </div>

            <div class="sdpi-item">
                <div class="sdpi-item-label">Timer Name</div>
                <input class="sdpi-item-value sdProperty" id="timerName" value="" placeholder="Enter the name of the Timer" oninput="setSettings()">
            </div>
            <div class="sdpi-item">
                <div class="sdpi-item-label">Tags</div>
                <input class="sdpi-item-value sdProperty" id="tags" value="" placeholder="Comma separated list of Tags" oninput="setSettings()">
            </div>
            <div class="sdpi-item">
                <div class="sdpi-item-label">Billable</div>
                <div class="sdpi-item-value">
                    <div class="sdpi-item-child">
                        <input class="sdpi-item-value sdProperty sdCheckbox" id="billable" type="checkbox" checked oninput="setSettings()">
                        <label for="billable"><span></span>Run timer as billable</label>
                    </div>
                </div>
            </div>
            <div type="group" class="sdpi-item" id="advanced">
                <div class="sdpi-item-label">Advanced</div>
                <div class="sdpi-item-group" id="messagegroup_items">
                    <div class="sdpi-item">
                        <div class="sdpi-item-label">Title Format</div>
                        <div class="sdpi-item-value textarea">
                            <textarea class="sdpi-item-value sdProperty" id="titleFormat" type="textarea" maxlength="100" oninput="setSettings()"></textarea>
                        </div>
                    </div>
                    <div class="sdpi-item">
                        <div class="sdpi-item-label">Refresh Rate</div>
                        <select class="sdpi-item-value sdProperty" id="refreshRate" oninput="setSettings()">
                            <option value="1">1 Second</option>
                            <option value="2">2 Seconds</option>
                            <option value="5" selected>5 Seconds</option>
                            <option value="10">10 Seconds</option>
                            <option value="20">20 Seconds</option>
                        </select>
                    </div>
                    <div class="sdpi-item">
                        <div class="sdpi-item-label">Server Url</div>
                        <input class="sdpi-item-value sdProperty" id="serverUrl" value="https://api.clockify.me/api/v1" placeholder="Enter the ULR of the Server" oninput="setSettings()" required>
                    </div>
                </div>
            </div>

            <!-- Versteckte Quell-Felder: von EasyPI persistiert, von clockify-pi.js gepflegt -->
            <input class="sdProperty cf-hidden" id="workspaceName" type="text">
            <input class="sdProperty cf-hidden" id="clientName" type="text">
            <input class="sdProperty cf-hidden" id="projectName" type="text">
            <input class="sdProperty cf-hidden" id="taskName" type="text">
            <input class="sdProperty sdCheckbox cf-hidden" id="workspaceManual" type="checkbox">
            <input class="sdProperty sdCheckbox cf-hidden" id="clientManual" type="checkbox">
            <input class="sdProperty sdCheckbox cf-hidden" id="projectManual" type="checkbox">
            <input class="sdProperty sdCheckbox cf-hidden" id="taskManual" type="checkbox">
        </div>
        <script src="clockify-pi.js"></script>
    </body>
</html>
